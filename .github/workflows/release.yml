name: HECATE Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "$TAG_VERSION" = "$PACKAGE_VERSION"

      - name: Install dependencies
        run: npm ci

      - name: Verify release invariants
        run: npm run verify:release

      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Clean-start smoke test
        run: npm run smoke:start

      - name: Full regression suite
        run: npm test

      - name: Encoding verification
        run: npm run check:encoding

      - name: Production UI build
        run: npm run build:ui

      - name: Validate deployment package
        run: npm pack --dry-run

      - name: Create deployment package
        run: npm pack

      - name: Generate package checksum
        shell: bash
        run: sha256sum ./*.tgz > SHA256SUMS

      - name: Upload deployment artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hecate-${{ github.ref_name }}
          path: |
            *.tgz
            SHA256SUMS
